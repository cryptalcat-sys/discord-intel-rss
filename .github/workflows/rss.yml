name: Intel RSS Poller

on:
  schedule:
    - cron: '*/20 * * * *'  # 每 20 分鐘自動巡邏一次 (可依需求啟用或註解)
  workflow_dispatch:        # 支援手動立即執行

# 🛡️ 防並發衝突：同一時間只允許一個工作流程執行
concurrency:
  group: intel-poller
  cancel-in-progress: true

# ⚠️ 關鍵修復：必須開放寫入權限，否則 git push 會被拒絕，導致 history.json 無法保存
permissions:
  contents: write

jobs:
  poll-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          pip install -r requirements.txt

      - name: 執行 RSS 抓取腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_POLITICS: ${{ secrets.DISCORD_WEBHOOK_POLITICS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u main.py

      - name: 提交並推送歷史記錄
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: 更新推播歷史紀錄 [skip ci]"
            git pull --rebase origin main
            git push origin main
          )
