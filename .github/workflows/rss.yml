name: Intel RSS Poller

on:
  schedule:
    - cron: '7,27,47 * * * *'  # 避開整數，在每小時的 07, 27, 47 分執行
  workflow_dispatch:

jobs:
  poll-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests feedparser beautifulsoup4

      - name: 執行 RSS 抓取腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_POLITICS: ${{ secrets.DISCORD_WEBHOOK_POLITICS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -u main.py

      - name: 提交並推送歷史記錄
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 更新推播歷史紀錄 [skip ci]" && git push)
