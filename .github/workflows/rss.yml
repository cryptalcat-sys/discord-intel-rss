name: Intel RSS Poller

on:
  schedule:
    - cron: '7,27,47 * * * *'  # 避開整數，在每小時的 07, 27, 47 分執行
  workflow_dispatch:

name: Intel RSS Poller

on:
  workflow_dispatch:

# 🛡️ 防並發衝突：同一時間只允許一個工作流程執行，有新任務時自動取消舊任務
concurrency:
  group: intel-poller
  cancel-in-progress: true

jobs:
  poll-and-send:
    runs-on: ubuntu-latest
    # ⏱️ 強制安全逾時：超過 5 分鐘直接強制結束，絕不卡死 28 分鐘
    timeout-minutes: 5

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          pip install -r requirements.txt

      - name: 執行 RSS 抓取腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_POLITICS: ${{ secrets.DISCORD_WEBHOOK_POLITICS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -u main.py

      - name: 提交並推送歷史記錄
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: 更新推播歷史紀錄 [skip ci]"
            git pull --rebase origin main
            git push origin main
          )
