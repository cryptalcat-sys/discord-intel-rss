name: Intel RSS Poller

on:
  schedule:
    - cron: '*/20 * * * *'  # 每 20 分鐘自動執行一次 (:00, :20, :40)
  workflow_dispatch:        # 保留手動觸發按鈕

jobs:
  run-rss:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴庫
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 RSS 抓取腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_POLITICS: ${{ secrets.DISCORD_WEBHOOK_POLITICS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py

      - name: 提交並推送更新的歷史紀錄
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update read news history [skip ci]" && git push)
